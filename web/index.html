<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HH Parser</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <header>
        <h1>HH Parser</h1>
        <p>Поиск вакансий на HeadHunter</p>
    </header>

    <div class="search">
        <input
            type="text"
            id="searchInput"
            placeholder="Например: Go разработчик"
        >
        <button id="searchButton">Найти</button>
    </div>

    <div id="status"></div>

    <div id="vacancies" class="vacancies"></div>
</div>

<script src="app.js"></script>
</body>
</html>
